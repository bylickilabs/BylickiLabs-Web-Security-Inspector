# =============================================================================
# BylickiLabs Web Security Inspector
# GitHub Actions: Qualität, Tests, Security und Windows-Build
# =============================================================================

name: BylickiLabs CI, Security and Windows Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  APP_NAME: BylickiLabsWebSecurityInspector
  APP_VERSION: "2.0.0"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  # ---------------------------------------------------------------------------
  # Codequalität
  #
  # Ruff ist zunächst nicht blockierend. Die gefundenen Hinweise bleiben in
  # GitHub Actions sichtbar, verhindern aber den Windows-Build nicht.
  # Nach der Bereinigung des Quellcodes kann "continue-on-error" entfernt werden.
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Entwicklungsabhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Python-Dateien kompilieren
        run: |
          set -euo pipefail
          python -m compileall -q app main.py

      - name: Ruff-Codeanalyse
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m ruff check . --output-format=github

      - name: Ruff-Formatierung prüfen
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m ruff format --check .

  # ---------------------------------------------------------------------------
  # Automatisierte Tests
  # ---------------------------------------------------------------------------
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Linux-Bibliotheken für PySide6 installieren
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Projekt- und Testabhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Tests mit Coverage ausführen
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          python -m pytest \
            --maxfail=1 \
            --disable-warnings \
            --junitxml=test-results-python-${{ matrix.python-version }}.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Tests ohne Coverage ausführen
        if: matrix.python-version != '3.11'
        run: |
          set -euo pipefail
          python -m pytest \
            --maxfail=1 \
            --disable-warnings \
            --junitxml=test-results-python-${{ matrix.python-version }}.xml

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            test-results-python-${{ matrix.python-version }}.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  # ---------------------------------------------------------------------------
  # Sicherheitsprüfungen
  #
  # Die Berichte werden als Artefakt hochgeladen. Die Prüfungen sind zunächst
  # nicht blockierend, damit Befunde ausgewertet werden können, ohne den Build
  # vollständig zu verhindern.
  # ---------------------------------------------------------------------------
  security:
    name: Security Reports
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten und Security-Werkzeuge installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit
          python -m pip check
          mkdir -p security-reports

      - name: Bandit-Bericht erstellen
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m bandit \
            --recursive app main.py \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output security-reports/bandit.json

      - name: Abhängigkeiten mit pip-audit prüfen
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip_audit \
            --requirement requirements.txt \
            --progress-spinner off \
            --format json \
            --output security-reports/pip-audit.json

      - name: Security-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-security-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  # ---------------------------------------------------------------------------
  # Windows-Anwendung
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows Build
    needs:
      - tests
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Build-Abhängigkeiten installieren
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Alte Build-Verzeichnisse entfernen
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($path in @("build", "dist", "artifacts")) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          New-Item -ItemType Directory -Path "artifacts" | Out-Null

      - name: Anwendung mit PyInstaller erstellen
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "BylickiLabsWebSecurityInspector.spec")) {
            throw "Die Datei BylickiLabsWebSecurityInspector.spec wurde nicht gefunden."
          }

          python -m PyInstaller `
            --noconfirm `
            --clean `
            "BylickiLabsWebSecurityInspector.spec"

          $buildPath = "dist\BylickiLabsWebSecurityInspector"

          if (-not (Test-Path $buildPath)) {
            throw "Der erwartete Windows-Build wurde nicht erzeugt: $buildPath"
          }

          if ((Get-ChildItem $buildPath -Recurse -Force).Count -eq 0) {
            throw "Das erzeugte Build-Verzeichnis ist leer."
          }

      - name: Windows-Paket und SHA-256-Prüfsumme erzeugen
        id: package
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
          }
          else {
            $version = "$env:APP_VERSION-build.$env:GITHUB_RUN_NUMBER"
          }

          $archiveName = "$env:APP_NAME-$version-Windows-x64.zip"
          $archivePath = Join-Path "artifacts" $archiveName

          Compress-Archive `
            -Path "dist\BylickiLabsWebSecurityInspector\*" `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal `
            -Force

          $hash = Get-FileHash $archivePath -Algorithm SHA256
          "$($hash.Hash.ToLower())  $archiveName" |
            Set-Content `
              -Path "artifacts\SHA256SUMS.txt" `
              -Encoding ascii

          "artifact_name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Windows-Build hochladen
        uses: actions/upload-artifact@v6
        with:
          name: BylickiLabs-Web-Security-Inspector-Windows
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
